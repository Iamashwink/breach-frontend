services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_EVENT_SLUG: ${VITE_EVENT_SLUG:-breachpoint-2026-r1}
    container_name: breachpoint-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
      - VITE_EVENT_SLUG=${VITE_EVENT_SLUG:-breachpoint-2026-r1}
